name: Publish cPanel build (primary)

# Publishes a pre-built, cPanel-tuned dist/ to the `cpanel-deploy` branch
# in THIS repo. cPanel Git Version Control clones that branch and, on
# "Update from Remote" + "Deploy HEAD Commit", runs .cpanel.yml to copy
# files into ~/public_html/aic/. Semi-automatic: GitHub side is fully
# automated; the final publish click happens in cPanel (no SSH on shared
# hosting).
#
# Flow:
#   push to main → build primary → commit to cpanel-deploy branch (fast-forward)
#   → (manual in cPanel) Update from Remote → Deploy HEAD Commit → live
#
# IMPORTANT: We commit incrementally on top of the existing branch — NOT a
# force-pushed orphan. cPanel's "Update from Remote" does a git pull, which
# can only fast-forward. Force-push orphans break that (cPanel silently stays
# on the old commit).

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild closes the fact-drift window (ADR-0003) — keeps the
  # primary build within ~24h of an aic release, mirroring the Pages cron.
  schedule:
    - cron: '17 3 * * *'

# contents:write lets the built-in GITHUB_TOKEN push the deploy branch.
permissions:
  contents: write

# One concurrent publish; never cancel a production build mid-flight.
concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (primary cPanel target)
        run: pnpm build
        env:
          # Primary domain — full SEO, indexed. Must match astro.config.mjs
          # defaults and SITE_ORIGIN in src/config/site.ts.
          SITE_ORIGIN: https://www.lookupapp.net
          BASE_PATH: /aic/
          NODE_OPTIONS: --max-old-space-size=4096

      # Commit dist/ contents to the cpanel-deploy branch incrementally.
      # We clone the existing branch, replace its files, commit on top, and
      # push normally (NO force-push). This keeps the history linear so
      # cPanel's "Update from Remote" (git pull) always fast-forwards.
      - name: Publish dist/ to cpanel-deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.email "deploy@aic-web"
          git config --global user.name "aic-web-deploy"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Stage the build output + deploy config
          STAGE=$(mktemp -d)
          cp -a dist/. "$STAGE"/
          cp .cpanel.yml "$STAGE"/

          # Clone the existing cpanel-deploy branch (or init if first run)
          if git clone --branch cpanel-deploy "$REPO_URL" /tmp/cpanel-deploy 2>/dev/null; then
            cd /tmp/cpanel-deploy
            # Clear old content (preserve .git for incremental history)
            find . -maxdepth 1 -not -name '.git' -not -name '.' -delete
          else
            mkdir -p /tmp/cpanel-deploy && cd /tmp/cpanel-deploy
            git init -b cpanel-deploy
            git remote add origin "$REPO_URL"
          fi

          cp -a "$STAGE"/. .
          git add -A
          git commit -m "deploy ${GITHUB_SHA::7}" --allow-empty
          git push origin cpanel-deploy
